<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Money Ledger</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="app dark">

  <header class="app-header">
    <h1>Money Ledger</h1>
  </header>

  <main class="app-main">

    <form id="ledger-form" class="form-grid">

      <!-- TYPE SELECTOR -->
      <label>
        <span>Type</span>
        <select id="entry-type" required>
          <option value="payout">Payout</option>
          <option value="other">Other</option>
          <option value="gas">Gas</option>
        </select>
      </label>

      <!-- PAYOUT FIELDS (FIXED: now hidden by default) -->
      <div id="payout-fields" class="hidden">
        <label>
          <span>Date</span>
          <input type="date" id="payout-date" required>
        </label>

        <label class="full">
          <span>Amount</span>
          <input type="number" id="payout-amount" step="0.01" required>
        </label>

        <label class="full">
          <span>Notes</span>
          <input type="text" id="payout-notes">
        </label>
      </div>

      <!-- OTHER FIELDS -->
      <div id="other-fields" class="hidden">
        <label>
          <span>Date</span>
          <input type="date" id="other-date" required>
        </label>

        <label class="full">
          <span>Amount (negative)</span>
          <input type="number" id="other-amount" step="0.01" required>
        </label>

        <label class="full">
          <span>Notes</span>
          <input type="text" id="other-notes">
        </label>
      </div>

      <!-- GAS FIELDS -->
      <div id="gas-fields" class="hidden">
        <label>
          <span>Date</span>
          <input type="date" id="gas-date" required>
        </label>

        <label>
          <span>Total Cost</span>
          <input type="number" id="gas-total" step="0.01" required>
        </label>

        <label>
          <span>PPG</span>
          <input type="number" id="gas-ppg" step="0.01" required>
        </label>

        <label>
          <span>Odometer</span>
          <input type="number" id="gas-odo" step="1" required>
        </label>

        <label>
          <span>MTE</span>
          <input type="number" id="gas-mte" step="1" required>
        </label>

        <label class="full">
          <span>Notes</span>
          <input type="text" id="gas-notes">
        </label>
      </div>

      <button type="submit" class="btn primary full">Add Entry</button>
    </form>

    <div id="message-bar" class="hidden"></div>

  </main>

  <script defer src="ledger2.js?v=1"></script>
</body>
</html>
