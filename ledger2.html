<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Money Ledger</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="app dark">

  <header class="app-header">
    <div class="nav-header">
      <div class="nav-title">
        <h1>Money Ledger</h1>
      </div>
      
      <nav class="top-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="ledger2.html" class="nav-link active">Ledger</a>
        <a href="trip-calculator.html" class="nav-link">Trip Calc</a>
      </nav>
    </div>
  </header>

  <main class="app-main">

    <form id="ledger-form" class="form-grid">

      <label>
        <span>Type</span>
        <select id="entry-type" required>
          <option value="payout">Payout</option>
          <option value="other">Other</option>
          <option value="gas">Gas</option>
        </select>
      </label>

      <div id="payout-fields" class="hidden">
        <label>
          <span>Date</span>
          <input type="date" id="payout-date" required>
        </label>

        <label class="full">
          <span>Amount</span>
          <input type="number" id="payout-amount" step="0.01" required>
        </label>

        <label class="full">
          <span>Notes</span>
          <input type="text" id="payout-notes">
        </label>
      </div>

      <div id="other-fields" class="hidden">
        <label>
          <span>Date</span>
          <input type="date" id="other-date" required>
        </label>

        <label class="full">
          <span>Amount (negative)</span>
          <input type="number" id="other-amount" step="0.01" required>
        </label>

        <label class="full">
          <span>Notes</span>
          <input type="text" id="other-notes">
        </label>
      </div>

      <div id="gas-fields" class="hidden">
        <label>
          <span>Date</span>
          <input type="date" id="gas-date" required>
        </label>

        <label>
          <span>Total Cost</span>
          <input type="number" id="gas-total" step="0.01" required>
        </label>

        <label>
          <span>PPG</span>
          <input type="number" id="gas-ppg" step="0.01" required>
        </label>

        <label>
          <span>Odometer</span>
          <input type="number" id="gas-odo" step="1" required>
        </label>

        <label>
          <span>MTE</span>
          <input type="number" id="gas-mte" step="1" required>
        </label>

        <label class="full">
          <span>Notes</span>
          <input type="text" id="gas-notes">
        </label>
      </div>

      <button type="submit" class="btn primary full">Add Entry</button>
    </form>

    <div id="message-bar" class="hidden"></div>

  </main>

  <script defer src="ledger2.js?v=2"></script>
</body>
</html>
