<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ledgr – Money Ledger</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="app.js"></script>
  <script defer src="ledger.js"></script>
</head>

<body class="app dark">
  <header class="app-header nav-header">
    <div class="nav-title">
      <h1>Money Ledger</h1>
      <p class="subtitle">Track payouts, gas, and expenses</p>
    </div>

    <nav class="top-nav">
      <a href="ledger.html" class="nav-link active">Ledger</a>
      <a href="trip-calculator.html" class="nav-link">Trip Calc</a>
      <a href="index.html" class="nav-link small">Home</a>
    </nav>
  </header>

  <main class="app-main">

    <!-- ENTRY FORM -->
    <section class="card">
      <h2>Add Entry</h2>

      <form id="ledger-form" class="form-grid">

        <label>
          <span>Date</span>
          <input type="date" id="entry-date" required />
        </label>

        <label>
          <span>Type</span>
          <select id="entry-type" required>
            <option value="payout">Payout</option>
            <option value="gas">Gas</option>
            <option value="other">Other</option>
          </select>
        </label>

        <!-- AMOUNT (PAYOUT + OTHER) -->
        <label id="amount-wrapper" class="full">
          <span>Amount</span>
          <div id="amount-field">
            <input type="number" id="entry-amount" step="0.01" />
          </div>
        </label>

        <!-- GAS FIELDS -->
        <label id="ppg-wrapper" class="hidden">
          <span>Price per gallon (PPG)</span>
          <input type="number" id="entry-ppg" step="0.01" />
        </label>

        <label id="odo-wrapper" class="hidden">
          <span>Odometer</span>
          <input type="number" id="entry-odo" step="1" />
        </label>

        <label id="mte-wrapper" class="hidden">
          <span>MTE (Miles Till Empty)</span>
          <input type="number" id="entry-mte" step="1" />
        </label>

        <label class="full">
          <span>Notes</span>
          <input type="text" id="entry-notes" />
        </label>

        <button type="submit" class="btn primary full">Add Entry</button>
      </form>
    </section>

    <!-- SUMMARY -->
    <section class="card">
      <h2>Summary</h2>

      <div class="summary-grid">
        <div class="summary-item">
          <span class="label">Total Payout</span>
          <span id="sum-payout" class="value">$0.00</span>
        </div>

        <div class="summary-item">
          <span class="label">Total Gas</span>
          <span id="sum-gas" class="value">$0.00</span>
        </div>

        <div class="summary-item">
          <span class="label">Total Other</span>
          <span id="sum-other" class="value">$0.00</span>
        </div>

        <div class="summary-item">
          <span class="label">Net</span>
          <span id="sum-net" class="value">$0.00</span>
        </div>

        <div class="summary-item">
          <span class="label">Miles Logged</span>
          <span id="sum-miles" class="value">0</span>
        </div>

        <div class="summary-item">
          <span class="label">Gallons Added</span>
          <span id="sum-gallons" class="value">0</span>
        </div>

        <div class="summary-item">
          <span class="label">Actual MPG</span>
          <span id="sum-mpg" class="value">–</span>
        </div>

        <div class="summary-item">
          <span class="label">Gas Cost / Mile</span>
          <span id="sum-gas-per-mile" class="value">–</span>
        </div>
      </div>
    </section>

    <!-- TABLE -->
    <section class="card">
      <h2>Entries</h2>

      <div class="table-wrapper">
        <table class="data-table" id="ledger-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Type</th>
              <th>$</th>
              <th>Odo</th>
              <th>MTE</th>
              <th>MPG</th>
              <th>Notes</th>
              <th></th>
            </tr>
          </thead>

          <tbody id="ledger-body"></tbody>
        </table>
      </div>

      <button id="clear-ledger" class="btn danger full">Clear All Entries</button>
    </section>

  </main>
</body>
</html>
